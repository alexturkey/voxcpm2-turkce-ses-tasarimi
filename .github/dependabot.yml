# Dependabot: requirements.txt bağımlılıklarını (numpy, soundfile) haftada bir denetler, güncelleme için PR açar.
# Güvenlik güncellemeleri (dependabot_security_updates) repo ayarından ayrıca açık; bu dosya sürüm güncellemeleri içindir.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["bagimlilik"]
    # numpy 2.3+ Python 3.10'u desteklemiyor (2.5.x: >=3.12); README 3.10-3.13 sözü korunur.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.3"]
    commit-message:
      prefix: "bagimlilik"
  # github-actions: workflows/denetim.yml eylemleri tam SHA'ya sabit; Dependabot haftalik yeni SHA onerir (2026-11-23: workflow eklendi, girdi geri geldi).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels: ["bagimlilik"]
    commit-message:
      prefix: "bagimlilik"
